[project]
name = "chemteb-retrieval-dataloader"
version = "0.1.0"
description = "Stream FineWeb-Edu, filter chemistry papers, and build retrieval datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=4.5.0",
    "pyarrow>=23.0.0",
]

[project.scripts]
chemfilter = "chemteb_retrieval_dataloader.cli:main"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemteb_retrieval_dataloader"]

